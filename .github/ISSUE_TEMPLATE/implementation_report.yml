name: Implementation report
description: Share de-identified evidence from a real src_you setup.
title: "[Implementation]: "
body:
  - type: markdown
    attributes:
      value: |
        Reports may describe success or failure. Never include personal values, secrets, screenshots, private locators, exports, backups, or raw documents.
  - type: input
    id: version
    attributes:
      label: src_you version
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: storage
    attributes:
      label: Storage class
      description: Use a generic class such as local files, private Git, document store, or database.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: AI platform or agent
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Adapter used or created
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup attempted
      description: Describe topology and logical scopes without private paths or values.
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked
    validations:
      required: true
  - type: textarea
    id: broke
    attributes:
      label: What broke or required a workaround
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: List scenario numbers and privacy-safe pass/fail evidence.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I included no secrets, personal values, screenshots, private IDs, raw state, or confidential documents.
          required: true
