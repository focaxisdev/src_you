name: Bug report
description: Report a reproducible defect in the framework, prompts, templates, or validation tools.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real personal state, secrets, private IDs, or confidential files. Use a synthetic reproduction.
  - type: input
    id: version
    attributes:
      label: src_you version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Architecture or concepts
        - Policy
        - Prompt
        - Template
        - Adapter
        - Validation tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Describe the smallest fictional setup that demonstrates the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected invariant or behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only synthetic or fully de-identified material and included no secrets.
          required: true
